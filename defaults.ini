[JishsFirstPersonMod]
; Same defaults as custom.2: unbound controls, spring off, unchanged FOV.
; Masks use XInput bits plus LT=0x10000, RT=0x20000.
first_person=0
look_up=0
look_down=0
look_left=0
look_right=0
look_up_angle=30
look_down_angle=30
look_left_angle=90
look_right_angle=90
; Reserve any chords assigned to stock ReSkate actions for conflict checks.
noclip=0
forward_velocity=0
up_velocity=0
fov=0
spring=0
offset_x=0
offset_y=0
offset_z=0
pitch=0
yaw=0
roll=0
strength_up=50
strength_down=50
strength_left=50
strength_right=50

disable_spring_on_foot=0

lock_camera_mount_jump=1

lock_camera_hippy_jump=0

look_only=0

toggle_glances=0

board_look=0
board_modifier=256
board_yaw_speed=330
board_pitch_speed=270
board_deadzone=.10
board_invert_y=0
board_yaw_limit=85
board_pitch_limit=60
board_look_smoothing=12
board_keep_native_input=1
board_center_on_stick=0
board_center_on_modifier=1
board_center_smoothing=35
board_center_pitch=0

# Independent UI keyboard default; saved bindings remain user-controlled.
menu_key=45

stick_smoothing_initialized=1
stick_spring=0
stick_strength_up=50
stick_strength_down=50
stick_strength_left=50
stick_strength_right=50

board_continue_auto_center=1
